<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Philippine Free TV</title>
    <link rel="stylesheet" href="style.css">
    <!-- HLS.js para maka-play og .m3u8 streams -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
</head>
<body>

    <!-- Animated Background Orbs -->
    <div class="bg-orb-2"></div>

    <header>
        <h1>📺 Philippine Free TV</h1>
        <p class="subtitle">Libre nga live channels — para sa personal use</p>
    </header>

    <main>
        <div class="controls">
            <select id="channel-select">
                <option value="">-- Loading channels... --</option>
            </select>
            <button id="play-btn">▶ Play</button>
            <button id="stop-btn">⏹ Stop</button>
        </div>

        <div id="video-container">
            <video id="video" controls playsinline></video>
        </div>

        <!-- Gi-wrap nako ang status para ma-center og tarong -->
        <div style="text-align: center; width: 100%; margin-top: 10px;">
            <p id="status">Ready</p>
        </div>
    </main>

    <footer>
        <p>Streams gikan sa publicly available sources (iptv-org). Dili guaranteed 24/7.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
