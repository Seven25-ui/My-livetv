<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SE7EN | Global Live Sports</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary-color: #ff4500; 
            --bg-color: #080808;
            --card-bg: #151515;
            --text-color: #ffffff;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Poppins', sans-serif; background-color: var(--bg-color); color: var(--text-color); overflow-x: hidden; padding-bottom: 80px; }

        header { padding: 40px 20px; text-align: center; background: linear-gradient(to bottom, #111, transparent); }
        .brand { font-family: 'Orbitron', sans-serif; font-size: 2.5rem; color: var(--primary-color); letter-spacing: 4px; text-shadow: 0 0 15px rgba(255, 69, 0, 0.5); }

        .main-player { width: 100%; max-width: 900px; margin: 0 auto 20px; background: #000; border-bottom: 3px solid var(--primary-color); position: sticky; top: 0; z-index: 1000; }
        video { width: 100%; aspect-ratio: 16/9; display: block; }

        .search-container { max-width: 500px; margin: 0 auto 30px; padding: 0 20px; }
        #channelSearch { width: 100%; padding: 12px 20px; border-radius: 5px; border: 1px solid #333; background: #1a1a1a; color: white; outline: none; }

        .container { padding: 0 15px 50px; max-width: 1200px; margin: auto; }
        .category-title { margin: 25px 0 15px; font-weight: 600; border-left: 4px solid var(--primary-color); padding-left: 10px; text-transform: uppercase; letter-spacing: 1px; font-size: 0.9rem; color: #eee; }

        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; }
        .channel-card { background: var(--card-bg); padding: 20px 10px; border-radius: 8px; text-align: center; cursor: pointer; border: 1px solid #222; transition: 0.3s; display: flex; align-items: center; justify-content: center; min-height: 70px; }
        .channel-card:hover { background: var(--primary-color); transform: translateY(-3px); }
        .channel-card p { font-size: 0.75rem; font-weight: bold; }

        .nba-special { background: linear-gradient(45deg, #1d428a, #c8102e); border: none; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }

        .back-btn { position: fixed; bottom: 20px; left: 20px; background: var(--primary-color); color: white; padding: 12px 20px; border-radius: 50px; text-decoration: none; font-weight: bold; font-size: 14px; z-index: 2000; box-shadow: 0 4px 15px rgba(255, 69, 0, 0.4); }

        @media (max-width: 600px) { .grid { grid-template-columns: repeat(2, 1fr); } }

        footer { padding: 30px; text-align: center; background: #050505; color: #444; font-size: 0.8rem; border-top: 1px solid #111; margin-top: 20px; }
        .credits span { color: var(--primary-color); font-weight: bold; }
    </style>
</head>
<body>

    <a href="index.html" class="back-btn"><i class="fas fa-arrow-left"></i> HOME</a>

    <header>
        <div class="brand">SE7EN LIVE</div>
        <p style="color: #666; font-size: 0.7rem; margin-top: 10px; letter-spacing: 2px;">GLOBAL SPORTS HUB</p>
    </header>

    <div class="main-player">
        <video id="videoPlayer" controls autoplay poster="https://wallpaperaccess.com/full/1510614.jpg"></video>
    </div>

    <div class="search-container">
        <input type="text" id="channelSearch" placeholder="Search NBA, Sports, Movies..." onkeyup="filterChannels()">
    </div>

    <div class="container">
        <h2 class="category-title">🏀 NBA & PREMIUM SPORTS</h2>
        <div class="grid" id="nbaGrid">
            <div class="channel-card nba-special" onclick="playVideo('https://d35u070iy8p9n3.cloudfront.net/v1/master/927702832968600/NBA-NBA-TV/index.m3u8')">
                <p>🏀 NBA TV LIVE</p>
            </div>
            <div class="channel-card nba-special" onclick="playVideo('https://sportsgrid-klowdtv.amagi.tv/playlist.m3u8')">
                <p>🏆 NBA NEWS & STATS</p>
            </div>
            <div class="channel-card nba-special" onclick="playVideo('https://dai.google.com/linear/hls/event/SidS8lb6T9S3uF6ID9pT6w/master.m3u8')">
                <p>🏅 GLOBAL SPORTS 1</p>
            </div>
        </div>

        <h2 class="category-title">🌍 LIVE GLOBAL SELECTION</h2>
        <div id="loadingSports" style="text-align:center; padding:20px; font-size: 0.8rem; color: var(--primary-color);">Searching Satellites...</div>
        <div class="grid" id="sportsGrid"></div>

        <h2 class="category-title">🎬 GLOBAL ENTERTAINMENT</h2>
        <div class="grid" id="worldGrid"></div>
    </div>

    <footer>
        <p>© 2026 SE7EN GLOBAL. ALL RIGHTS RESERVED.</p>
        <div class="credits">POWERED BY <span>ALOYGENEX</span></div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script>
        let hls = new Hls({
            enableWorker: true,
            lowLatencyMode: true
        });
        const video = document.getElementById('videoPlayer');

        function playVideo(url) {
            window.scrollTo({ top: 0, behavior: 'smooth' });
            if (Hls.isSupported()) {
                hls.destroy();
                hls = new Hls();
                hls.loadSource(url);
                hls.attachMedia(video);
                hls.on(Hls.Events.MANIFEST_PARSED, () => {
                    video.play().catch(() => console.log("Manual play required"));
                });
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = url;
                video.play();
            }
        }

        async function loadGlobalChannels() {
            const url = 'https://iptv-org.github.io/iptv/index.m3u';
            try {
                const response = await fetch(url);
                const data = await response.text();
                const lines = data.split('\n');
                document.getElementById('loadingSports').style.display = 'none';

                let currentName = '';
                let sportsCount = 0;
                let worldCount = 0;

                for (let i = 0; i < lines.length; i++) {
                    let line = lines[i].trim();
                    if (line.startsWith('#EXTINF')) {
                        currentName = line.split(',')[1] || 'Live Channel';
                    } else if (line.startsWith('http')) {
                        const nameLower = currentName.toLowerCase();
                        
                        // PRIORITIZE GLOBAL SPORTS [cite: 2026-01-31]
                        if (nameLower.includes('sports') || nameLower.includes('football') || nameLower.includes('espn')) {
                            if (sportsCount < 40) {
                                createCard(currentName, line, 'sportsGrid');
                                sportsCount++;
                            }
                        } 
                        // GLOBAL ENTERTAINMENT (Movies/News) [cite: 2026-01-31]
                        else if (nameLower.includes('movie') || nameLower.includes('news') || nameLower.includes('cinema')) {
                            if (worldCount < 20) {
                                createCard(currentName, line, 'worldGrid');
                                worldCount++;
                            }
                        }
                    }
                }
            } catch (e) {
                document.getElementById('loadingSports').innerText = "Network Busy. Refresh Page.";
            }
        }

        function createCard(name, url, gridId) {
            const card = document.createElement('div');
            card.className = 'channel-card';
            card.setAttribute('data-name', name.toLowerCase());
            card.onclick = () => playVideo(url);
            card.innerHTML = `<p>${name}</p>`;
            document.getElementById(gridId).appendChild(card);
        }

        function filterChannels() {
            const query = document.getElementById('channelSearch').value.toLowerCase();
            document.querySelectorAll('.channel-card').forEach(card => {
                const name = card.getAttribute('data-name') || "";
                card.style.display = name.includes(query) ? 'flex' : 'none';
            });
        }

        loadGlobalChannels();
    </script>
</body>
</html>
