<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free Live TV | Global & PH Streams</title>
    
    <!-- SVG Favicon (TV Icon nga blue) -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%233b82f6' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Crect x='2' y='7' width='20' height='15' rx='2' ry='2'%3E%3C/rect%3E%3Cpolyline points='17 2 12 7 7 2'%3E%3C/polyline%3E%3C/svg%3E">
    
    <link rel="stylesheet" href="style.css">
    <!-- HLS.js for .m3u8 stream playback -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
</head>
<body>

    <!-- Animated Background Orbs -->
    <div class="bg-orb-2"></div>

    <header>
        <h1>📺 Free Live TV</h1>
        <p class="subtitle">Watch live channels from the Philippines and around the world</p>
    </header>

    <main>
        <div class="controls">
            <!-- Source Dropdown -->
            <select id="source-select" aria-label="Select Playlist Source">
                <option value="ph">🇵🇭 Philippines</option>
                <option value="global">🌍 Global (All)</option>
                <option value="global_news">📰 Global News</option>
                <option value="global_sports">⚽ Global Sports</option>
                <option value="global_movies">🎬 Global Movies</option>
            </select>

            <!-- Channel Dropdown -->
            <select id="channel-select" aria-label="Select a Channel">
                <option value="">-- Loading channels... --</option>
            </select>

            <!-- Control Buttons -->
            <button id="play-btn" aria-label="Play selected channel">▶ Play</button>
            <button id="stop-btn" aria-label="Stop playback">⏹ Stop</button>
        </div>

        <div id="video-container">
            <video id="video" controls playsinline></video>
        </div>

        <div style="text-align: center; width: 100%; margin-top: 10px;">
            <p id="status">Ready</p>
        </div>
    </main>

    <footer>
        <p>Streams provided from publicly available sources (iptv-org). Not guaranteed 24/7.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
